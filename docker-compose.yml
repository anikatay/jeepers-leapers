services:
  app:
    build: .
    ports:
      - "8095:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/paysprint
      SPRING_DATASOURCE_USERNAME: paysprint
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paysprint
      POSTGRES_USER: paysprint
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Only db is reachable from the host. app is not. This mirrors a real
      # deployment where the database is internal but needs to be accessible
      # to DBA tooling running on the developer's machine during development.
      - "8100:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  frontend:
    build: ./frontend
    depends_on:
      - app
    ports:
      - "8090:80"

  # Analytics ETL Services
  airflow-webserver:
    build:
      context: ./analytics
      dockerfile: docker/Dockerfile.airflow
    command: airflow webserver
    ports:
      - "8082:8082"
    depends_on:
      - db
    environment:
      ENVIRONMENT: docker
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: paysprint
      DB_ANALYTICS_NAME: paysprint_analytics
      DB_USER: paysprint
      DB_PASSWORD: ${DB_PASSWORD}
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    volumes:
      - ./analytics/airflow/dags:/opt/airflow/dags
      - ./analytics/etl:/opt/airflow/etl
      - airflow_data:/opt/airflow
    networks:
      - default

  airflow-scheduler:
    build:
      context: ./analytics
      dockerfile: docker/Dockerfile.airflow
    command: airflow scheduler
    depends_on:
      - db
      - airflow-webserver
    environment:
      ENVIRONMENT: docker
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: paysprint
      DB_ANALYTICS_NAME: paysprint_analytics
      DB_USER: paysprint
      DB_PASSWORD: ${DB_PASSWORD}
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    volumes:
      - ./analytics/airflow/dags:/opt/airflow/dags
      - ./analytics/etl:/opt/airflow/etl
      - airflow_data:/opt/airflow
    networks:
      - default

volumes:
  db_data:
    # Named volume: persists Postgres data across `docker compose down` and
    # `docker compose up`. Use `docker compose down -v` to also remove this
    # volume, which wipes the database and starts fresh on the next `up`
  airflow_data:
    # Named volume: persists Airflow metadata and logs