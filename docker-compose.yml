x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://paysprint:${DB_PASSWORD}@db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    # Pipeline DB connections
    DB_USER: paysprint
    DB_PASSWORD: ${DB_PASSWORD}
    DB_HOST: db
    DB_PORT: '5432'
    OLTP_DB_NAME: paysprint
    ANALYTICS_DB_NAME: paysprint_analytics
    _PIP_ADDITIONAL_REQUIREMENTS: "pandas>=2.0 sqlalchemy>=2.0 psycopg[binary]>=3.1"
  volumes:
    - ./src/main/python/dags:/opt/airflow/dags
    - ./src/main/python/utils:/opt/airflow/utils
    - ./src/main/python/analytics_schema.sql:/opt/airflow/analytics_schema.sql
    - airflow_logs:/opt/airflow/logs
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    build: .
    # No ports: mapping — the app service is intentionally unreachable from the
    # host. It can reach `db` by the service name "db" (Docker bridge DNS),
    # but nothing outside Docker can reach `app` unless a ports: entry is added.
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/paysprint
      SPRING_DATASOURCE_USERNAME: paysprint
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paysprint
      POSTGRES_USER: paysprint
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Only db is reachable from the host. app is not. This mirrors a real
      # deployment where the database is internal but needs to be accessible
      # to DBA tooling running on the developer's machine during development.
      - "8100:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paysprint"]
      interval: 5s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      - app
    ports:
      - "8090:80"

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db_data:
    # Named volume: persists Postgres data across `docker compose down` and
    # `docker compose up`. Use `docker compose down -v` to also remove this
    # volume, which wipes the database and starts fresh on the next `up`.
  airflow_logs: