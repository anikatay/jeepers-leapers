services:
  redis:
    image: redis:7-alpine
  market:
    build: ./market
    ports:
      - ${Market_port}
    environment:
      BACKEND_QUOTE_URL: http://app:8080/internal/market/quotes
      SECTOR_STREAM_ENABLED: ${SECTOR_STREAM_ENABLED:-false}
  kafka:
    image: apache/kafka:latest
    ports: 
      - ${Kafka_port}
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:8092,CONTROLLER://:8093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:8092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:8093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  app:
    build: .
    ports:
      - ${App_port}
    depends_on:
      - db
      - market
      - redis
      - kafka

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/paysprint
      SPRING_DATASOURCE_USERNAME: paysprint
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:8092
      JWT_SHARED_SECRET: ${JWT_SHARED_SECRET}
      ANALYTICS_DATASOURCE_URL: jdbc:postgresql://db:5432/paysprint_analytics
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paysprint
      POSTGRES_USER: paysprint
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Only db is reachable from the host. app is not. This mirrors a real
      # deployment where the database is internal but needs to be accessible
      # to DBA tooling running on the developer's machine during development.
      - ${DB_PORT_J}
    volumes:
      - db_data:/var/lib/postgresql/data
  etl:
    # Refreshes analytics P&L (paysprint_analytics) on a fixed interval and exposes
    # the internal POST /refresh endpoint used by the Spring app.
    build: ./analytics
    init: true
    restart: unless-stopped
    depends_on:
      - db
      - app
    expose:
      - "8094"
    environment:
      PAYSPRINT_SOURCE_DB_URL: postgresql://paysprint:${DB_PASSWORD}@db:5432/paysprint
      PAYSPRINT_ANALYTICS_DB_URL: postgresql://paysprint:${DB_PASSWORD}@db:5432/paysprint_analytics
      ETL_INTERVAL_SECONDS: ${ETL_INTERVAL_SECONDS:-600}

  frontend:
    build: ./frontend
    depends_on:
      - app
    ports:
      - ${Frontend_port}

volumes:
  db_data:
    # Named volume: persists Postgres data across `docker compose down` and
    # `docker compose up`. Use `docker compose down -v` to also remove this
    # volume, which wipes the database and starts fresh on the next `up`.