# ── Application  ──────────────────────────────────────────────────────────────
spring.application.name=bull-exchange

# ── Datasource ────────────────────────────────────────────────────────────────
# These values are overridden at runtime by the SPRING_DATASOURCE_* environment
# variables set in docker-compose.yml. The defaults here allow local development.
spring.datasource.url=jdbc:postgresql://localhost:8100/paysprint
spring.datasource.username=paysprint
spring.datasource.password=changeme

# ── SQL Init Scripts ──────────────────────────────────────────────────────────
# Run schema.sql then data.sql on every startup. "always" is needed for
# non-embedded databases like Postgres.
spring.sql.init.mode=always

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
# We manage the schema ourselves via schema.sql — don't let Hibernate touch it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Suppress the warning about open-in-view being enabled by default.
spring.jpa.open-in-view=false

# ── MyBatis ─────────────────────────────────────────────────────────────────────
# Register custom type handlers and configure MyBatis
mybatis.type-handlers-package=com.neueda.leap.config
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-statement-timeout=30

# ── JWT (JSON Web Token) ──────────────────────────────────────────────────────
jwt.shared-secret=changeme

# ── AI trade analysis ─────────────────────────────────────────────────────────
# Without a key the app still starts; only POST /api/trades/{id}/analysis fails.
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=https://api.openai.com/v1

# P&L comes from analytics.fact_trades, which the ETL pipeline fills. The app starts
# without this database; trades are then analysed without a P&L outcome.
analytics.datasource.url=jdbc:postgresql://localhost:8100/paysprint_analytics
analytics.datasource.username=${spring.datasource.username}
analytics.datasource.password=${spring.datasource.password}
