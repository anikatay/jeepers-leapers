# ── Application  ──────────────────────────────────────────────────────────────
spring.application.name=bull-exchange

# ── Datasource ────────────────────────────────────────────────────────────────
# These values are overridden at runtime by the SPRING_DATASOURCE_* environment
# variables set in docker-compose.yml. The defaults here allow local development.
spring.datasource.url=jdbc:postgresql://localhost:8100/paysprint
spring.datasource.username=paysprint
spring.datasource.password=changeme

# ── SQL Init Scripts ──────────────────────────────────────────────────────────
# Run schema.sql then data.sql on every startup. "always" is needed for
# non-embedded databases like Postgres.
spring.sql.init.mode=always

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
# We manage the schema ourselves via schema.sql — don't let Hibernate touch it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Suppress the warning about open-in-view being enabled by default.
spring.jpa.open-in-view=false

# ── MyBatis ─────────────────────────────────────────────────────────────────────
# Register custom type handlers and configure MyBatis
mybatis.type-handlers-package=com.neueda.leap.config
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-statement-timeout=30

# ── MarketData ─────────────────────────────────────────────────────────────────────
market.url=http://market:8093

# ── Redis ─────────────────────────────────────────────────────────────────────
spring.data.redis.host=redis
spring.data.redis.port=6379
# ── Kafka ─────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=kafka:8092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=jeepers1
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.neueda.leap.event
spring.kafka.consumer.auto-offset-reset=earliest

market.lock-ttl-seconds=20
market.refresh-cooldown-seconds=180
market.fetch-retry-delay-ms=120
market.subscription.scheduler-delay-ms=500
market.subscription.hot-refresh-seconds=10
market.subscription.warm-refresh-seconds=45
market.subscription.cold-refresh-seconds=180
market.subscription.hot-window-seconds=120
market.subscription.upstream-min-interval-ms=3000
market.subscription.batch-max-tickers=25

# Trade quote freshness
trade.max-price-age-seconds=180
quote.refresh-threshold-seconds=120
quote.lock-ttl-seconds=20
instrument.price-sync-delay-ms=10000
# ── JWT (JSON Web Token) ──────────────────────────────────────────────────────
jwt.shared-secret=changeme
