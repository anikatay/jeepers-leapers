# ── Application  ──────────────────────────────────────────────────────────────
spring.application.name=bull-exchange

# ── Datasource ────────────────────────────────────────────────────────────────
# These values are overridden at runtime by the SPRING_DATASOURCE_* environment
# variables set in docker-compose.yml. The defaults here allow local development.
spring.datasource.url=jdbc:postgresql://localhost:8100/paysprint
spring.datasource.username=paysprint
spring.datasource.password=changeme

# ── SQL Init Scripts ──────────────────────────────────────────────────────────
# Run schema.sql then data.sql on every startup. "always" is needed for
# non-embedded databases like Postgres.
spring.sql.init.mode=always

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
# We manage the schema ourselves via schema.sql — don't let Hibernate touch it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Suppress the warning about open-in-view being enabled by default.
spring.jpa.open-in-view=false

# ── MyBatis ─────────────────────────────────────────────────────────────────────
# Register custom type handlers and configure MyBatis
mybatis.type-handlers-package=com.neueda.leap.config
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-statement-timeout=30

# ── MarketData ─────────────────────────────────────────────────────────────────────
market.url=http://market:8093

# ── Redis ─────────────────────────────────────────────────────────────────────
spring.data.redis.host=redis
spring.data.redis.port=6379
# ── Kafka ─────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=kafka:8092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=jeepers1
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.neueda.leap.event
spring.kafka.consumer.auto-offset-reset=earliest

market.lock-ttl-seconds=20
market.refresh-cooldown-seconds=180
market.fetch-retry-delay-ms=120
market.subscription.hot-window-seconds=120

# Trade quote freshness
trade.max-price-age-seconds=180
quote.cache-ttl-seconds=60
quote.refresh-threshold-seconds=120
quote.lock-ttl-seconds=20
fx.rate-cache-ttl-seconds=60
instrument.price-sync-delay-ms=10000

# ── JWT (JSON Web Token) ──────────────────────────────────────────────────────
jwt.shared-secret=changeme

# ── AI trade analysis ─────────────────────────────────────────────────────────
# Without a key the app still starts; only POST /api/trades/{id}/analysis fails.
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=https://api.openai.com/v1

# Limits on POST /api/trades/{id}/analysis, per calendar minute and per app instance.
# A client is identified by X-Real-IP (set by nginx), else the remote address.
analysis.rate-limit.global-per-minute=20
analysis.rate-limit.per-client-per-minute=5
# Analyses are reused while everything the model would be told is unchanged.
analysis.cache.max-entries=500

# P&L comes from analytics.fact_trades, which the ETL pipeline fills. The app starts
# without this database; trades are then analysed without a P&L outcome.
analytics.datasource.url=jdbc:postgresql://localhost:8100/paysprint_analytics
analytics.datasource.username=${spring.datasource.username}
analytics.datasource.password=${spring.datasource.password}
