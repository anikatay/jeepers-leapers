<main class="auth-page">
  <header class="auth-toolbar">
    <a class="brand" routerLink="/" [attr.aria-label]="'auth.home_aria' | translate">
      <img class="brand-logo" src="/symbol.PNG" alt="" />
      <span class="brand-name font-display">Bull Exchange</span>
    </a>
    <app-language-selector />
  </header>

  <div class="auth-card" [class.is-register]="isRegister()">
    <section
      class="form-container sign-in-container"
      [attr.inert]="isRegister() ? '' : null"
      [attr.aria-hidden]="isRegister()"
    >
      <app-login />
    </section>

    <section
      class="form-container sign-up-container"
      [attr.inert]="isRegister() ? null : ''"
      [attr.aria-hidden]="!isRegister()"
    >
      <app-register />
    </section>

    <div class="overlay-container">
      <div class="overlay">
        <div
          class="overlay-panel overlay-left"
          [attr.inert]="isRegister() ? null : ''"
          [attr.aria-hidden]="!isRegister()"
        >
          <img class="overlay-logo" src="/symbol.PNG" alt="" />
          <h2>{{ 'auth.welcome_new' | translate }}</h2>
          <p class="overlay-copy">{{ 'auth.welcome_new_copy' | translate }}</p>
          <a class="ghost-btn" routerLink="/auth/login" (click)="isRegister.set(false)">{{ 'auth.sign_in' | translate }}</a>
        </div>

        <div
          class="overlay-panel overlay-right"
          [attr.inert]="isRegister() ? '' : null"
          [attr.aria-hidden]="isRegister()"
        >
          <img class="overlay-logo" src="/symbol.PNG" alt="" />
          <h2>{{ 'auth.welcome_back' | translate }}</h2>
          <p class="overlay-copy">{{ 'auth.welcome_back_copy' | translate }}</p>
          <a class="ghost-btn" routerLink="/auth/register" (click)="isRegister.set(true)">{{ 'auth.create_account' | translate }}</a>
        </div>
      </div>
    </div>
  </div>

  <div class="route-slot" aria-hidden="true">
    <router-outlet />
  </div>
</main>
