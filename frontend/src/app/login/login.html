<h1>Mission Control</h1>

  <main>
    <form (ngSubmit)="confirmLogIn()">
      <h2>Log In</h2>

      <div class="field">
        <label for="email">Email</label>
        <input
          type="text"
          id="email"
          name="email"
          required
          autocomplete="email"
          [(ngModel)]="email"
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="current-password"
          [(ngModel)]="password"
        />
      </div>

      @if (message()){
        <p class = "message" [class.error]="isError()">{{ message() }}</p>
      }

      <button type="submit">Log In</button>
    </form>
  </main>

  <footer>
    <p>LEAP Mission Control</p>
  </footer>
