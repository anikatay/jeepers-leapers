<!-- Figma-compliant navbar with search, navigation, theme, and profile controls -->
<header class="navbar-header">
  <!-- Top row: Logo, Nav, Appearance, Profile -->
  <div class="navbar-top">
    <!-- Logo and Brand (left) -->
    <div class="navbar-logo">
      <button class="logo-button" [routerLink]="['/client']">
        <img src="/symbol.PNG" alt="LEAP logo" class="logo-image" />
        <span class="brand-text font-display">{{ brandName }}</span>
      </button>
    </div>

    <!-- Center Navigation -->
    <nav class="navbar-nav" [attr.aria-label]="'nav.main_navigation' | translate">
      <a *ngFor="let item of navItems"
         [routerLink]="[item.path]"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: item.path === '/client' }"
         class="nav-link">
        {{ item.label | translate }}
        <span class="nav-underline" *ngIf="false"></span>
      </a>
    </nav>

    <!-- Right controls: Appearance + Language + Profile -->
    <div class="navbar-controls">
      <app-appearance-controls />

      <!-- Language Dropdown -->
      <div class="language-container" (click)="$event.stopPropagation()">
        <button class="language-button" (click)="toggleLanguageDropdown()" [title]="'nav.select_language' | translate">
          <!-- Globe icon -->
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <!-- Language label (optional, shows selected) -->
          <span class="language-label">{{ selectedLanguage() | slice:0:2 | uppercase }}</span>
          <!-- Dropdown arrow -->
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <!-- Language Dropdown Menu -->
        <div class="language-menu" *ngIf="languageOpen()" (click)="$event.stopPropagation()">
          <div class="language-panel">
            <p class="panel-title">{{ 'nav.language' | translate }}</p>
            <div class="language-list">
              <button *ngFor="let lang of languages()"
                      class="language-item"
                      [class.active]="selectedLanguage() === lang.code"
                      (click)="selectLanguage(lang.code)">
                <span class="lang-english">{{ lang.englishName }}</span>
                <span class="lang-native">{{ lang.nativeName }}</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Profile Dropdown -->
      <div class="profile-container" (click)="$event.stopPropagation()">
        <button class="profile-button" (click)="toggleProfile()">
          <div class="avatar">{{ avatarLetter }}</div>
          <span class="username">{{ 'nav.hi' | translate }} {{ userName.split(' ')[0] }}</span>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <!-- Profile Menu -->
        <div class="profile-menu" *ngIf="profileOpen()" (click)="$event.stopPropagation()">
          <button class="menu-item" (click)="selectProfileOption('profile')">
            <span>{{ 'nav.profile' | translate }}</span>
          </button>
          <div class="menu-divider"></div>
          <button class="menu-item logout" (click)="selectProfileOption('logout')">
            <span>{{ 'nav.sign_out' | translate }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Search row (below top row) -->
  <div class="navbar-search-row">
    <div class="search-container" (click)="$event.stopPropagation()">
      <div class="search-input-wrapper">
        <!-- Search icon -->
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path stroke-linecap="round" d="M21 21l-4.35-4.35"></path>
        </svg>

        <!-- Search input -->
        <input
          type="text"
          class="search-input"
          placeholder="Enter company or symbol"
          [attr.aria-label]="'nav.search_aria' | translate"
          [ngModel]="searchQuery()"
          (input)="onSearchInput($event)"
          (focus)="onSearchFocus()"
          (keydown)="onSearchKeyDown($event)"
          autocomplete="off" />

        <!-- Trade button -->
        <button class="trade-button" (click)="tradeClick()">
          {{ 'nav.trade' | translate }}
        </button>
      </div>

      <!-- Search hint -->
      <p class="search-hint">e.g. AAPL, TSLA, NVDA</p>

      <!-- Search dropdown results -->
      <div class="search-dropdown" *ngIf="searchOpen() && searchQuery().length > 0" (click)="$event.stopPropagation()">
        <div *ngIf="searchResults().length === 0" class="no-results">
          <p>{{ 'nav.no_results' | translate }}</p>
        </div>
        <button *ngFor="let result of searchResults()"
                class="search-result-item"
                (click)="selectStock(result)">
          <div class="result-left">
            <span class="result-symbol font-mono-data">{{ result.symbol }}</span>
            <span class="result-name">{{ result.name }}</span>
          </div>
          <span class="result-price font-mono-data">${{ result.price }}</span>
        </button>
      </div>
    </div>
  </div>
</header>
